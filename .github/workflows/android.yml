name: Build Android APK

# Every push (any branch) builds a signed APK and publishes it as the "latest" GitHub Release.
# Stable download link:
#   https://github.com/tobyhome12345-commits/Time-Tracker/releases/latest/download/TouchGrass.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Builds run one at a time and are never cut off mid-way, so the newest push always ends up as "latest".
# (If several pushes queue up while a build is running, GitHub skips to the newest one.)
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Work out version
        id: ver
        run: |
          # versionCode = minutes since 2024-01-01 UTC: always goes up, so each APK installs over the last one.
          CODE=$(( ($(date -u +%s) - 1704067200) / 60 ))
          NAME="1.0.${{ github.run_number }}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building Touch Grass $NAME (versionCode $CODE)"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build
        env:
          APP_VERSION: ${{ steps.ver.outputs.name }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          grep -q "CN=Touch Grass" signature.txt
          cp "$APK" TouchGrass.apk
          ls -lh TouchGrass.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: TouchGrass-${{ steps.ver.outputs.name }}
          path: TouchGrass.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Touch Grass ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: TouchGrass.apk
          body: |
            🌱 **Touch Grass ${{ steps.ver.outputs.name }}**

            **Install on Android:** tap `TouchGrass.apk` below (or use the forever link
            https://github.com/${{ github.repository }}/releases/latest/download/TouchGrass.apk),
            then open the download and tap **Install** / **Update**. Your data is kept.

            Built from `${{ github.ref_name }}` @ ${{ github.sha }}
            > ${{ github.event.head_commit.message }}

      - name: Tidy old releases (keep newest 15)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[15:] | .[].tagName' |
          while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          done
